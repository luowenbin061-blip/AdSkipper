name: simtest

on:
  push:
    branches: [main]
    paths: ['AdSkipper.m', 'TestHost/**', '.github/workflows/simtest.yml']
  workflow_dispatch:

jobs:
  sim:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib (iphonesimulator, arm64)
        run: |
          set -e
          SYSROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun -sdk iphonesimulator clang -dynamiclib \
            -arch arm64 \
            -miphonesimulator-version-min=15.0 \
            -isysroot "$SYSROOT" \
            -fobjc-arc -fvisibility=hidden -O2 \
            -install_name @rpath/AdSkipper.dylib \
            -o AdSkipper_sim.dylib AdSkipper.m \
            -framework Foundation -framework UIKit -framework Vision \
            -framework CoreGraphics -framework QuartzCore
          file AdSkipper_sim.dylib

      - name: Build test host app
        run: |
          set -e
          mkdir -p TestHost.app
          SYSROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun -sdk iphonesimulator swiftc TestHost/main.swift \
            -sdk "$SYSROOT" -target arm64-apple-ios15.0-simulator \
            -o TestHost.app/TestHost -framework UIKit
          cp TestHost/Info.plist TestHost.app/Info.plist
          # dlopen 需要 dylib 在 app bundle 内（模拟 TrollyFools 注入后的位置）
          cp AdSkipper_sim.dylib TestHost.app/AdSkipper_sim.dylib
          cp TestHost/adskipper_selftest.png TestHost.app/
          ls -la TestHost.app

      - name: Boot simulator, inject dylib, run
        run: |
          set -e
          xcrun simctl list devices available | grep iPhone || true
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (15|16|14)" | head -1 | grep -oE "[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}")
          echo "Using UDID=$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" TestHost.app
          # 不用 --console（模拟器 NSLog 不进 stdout，靠沙盒日志文件断言）
          # 不用 DYLD_INSERT（arm64 模拟器不生效）；TestHost main.swift 顶层 dlopen 加载 bundle 内 dylib
          # -adskipper_selftest 1 → NSArgumentDomain，插件改用 bundle 内预置广告图跑识别链
          xcrun simctl launch "$UDID" wb.testhost -adskipper_selftest 1
          sleep 25
          DATA=$(xcrun simctl get_app_container "$UDID" wb.testhost data)
          echo "data container: $DATA"
          if [ -f "$DATA/Documents/AdSkipper.log" ]; then
            echo "================ AdSkipper.log ================"
            cat "$DATA/Documents/AdSkipper.log"
            echo "==============================================="
            cp "$DATA/Documents/AdSkipper.log" sim.log
            cp "$DATA/Documents/AdSkipper_shot.png" shot.png 2>/dev/null || echo "no shot"
            ls -la shot.png 2>/dev/null || true
          else
            echo "!!! AdSkipper.log NOT FOUND - dylib was NOT loaded"
            echo "dylib not loaded" > sim.log
          fi

      - name: Verdict
        run: |
          PASS=1
          for m in "armed" "floating ball created" "monitor start" "tapped OK, done"; do
            if grep -q "$m" sim.log; then
              echo "PASS: $m"
            else
              echo "FAIL: $m"
              PASS=0
            fi
          done
          if [ "$PASS" = "1" ]; then
            echo "E2E RESULT: ALL PASS"
          else
            echo "E2E RESULT: FAILED"
            exit 1
          fi

      - name: Upload sim log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-log
          path: |
            sim.log
            shot.png
